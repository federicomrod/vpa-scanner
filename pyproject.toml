[project]
name = "vpa-scanner"
version = "0.1.0"
description = "Morning Volume Price Analysis scanner for US mid-cap stocks. Produces a shortlist for a human trader to review by email. Never places trades."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<0.8",
    "pre-commit>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: standard pyflakes/pycodestyle checks
# I: import sorting
# UP: modernise syntax for the pinned Python version
# B: common bug-prone patterns (flake8-bugbear)
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
